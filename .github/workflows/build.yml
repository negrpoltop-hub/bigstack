name: Build BigStacks

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and package (with warnings)
        run: mvn -B -ntp -Dmaven.compiler.showWarnings=true -Dmaven.compiler.showDeprecation=true clean package

      - name: Check jar contents
        run: |
          JAR=$(ls target/BigStacks-*.jar | head -n1)
          echo "Jar: $JAR"
          unzip -l "$JAR" | grep -q "plugin.yml" || { echo "plugin.yml missing"; exit 1; }
          unzip -l "$JAR" | grep -q "config.yml" || { echo "config.yml missing"; exit 1; }
          unzip -l "$JAR" | grep -q "ru/bigstacks/BigStacks.class" || { echo "main class missing"; exit 1; }

      - name: Static analysis (SpotBugs, non-blocking)
        continue-on-error: true
        run: mvn -B -ntp com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:spotbugs

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: BigStacks
          path: target/BigStacks-*.jar
          if-no-files-found: error

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp
